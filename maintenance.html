<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arad Maps</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            color: #b8c0cc;
            font-size: 18px;
            line-height: 1.9;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-top: 30px;
            padding: 10px 18px;

            border: 1px solid #374151;
            border-radius: 999px;

            color: #9ca3af;
            font-size: 14px;
        }

        .status span {
            width: 9px;
            height: 9px;
            background: #f59e0b;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <main class="maintenance">
        <div class="icon">🗺️</div>

        <h1>در حال ساخت</h1>

        <p>
            این پروژه فعلاً در دست توسعه است.
            <br>
            به‌زودی با یک تجربه جدید برمی‌گردیم!
        </p>

        <div class="status">
            <span></span>
            Maintenance Mode
        </div>
    </main>

</body>
</html>
